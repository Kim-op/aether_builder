spring:
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
  application:
    name: aether_builder-backend
  profiles:
    active: local
  banner:
    location: banner.txt
server:
  port: 8956
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 2592000
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.aetherbuilder.nocode.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn